name: Update commit city

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  city:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Draw the city
        run: node scripts/generate-city.mjs
        env:
          # PROFILE_TOKEN (a PAT with read:user) is optional; it lets private repo work count.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add city.svg
          git diff --staged --quiet || git commit -m "chore: update commit city"
          git push
